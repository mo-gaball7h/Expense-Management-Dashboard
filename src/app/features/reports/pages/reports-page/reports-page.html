<div class="reports-container">
  
  <!-- Breadcrumb / Workspace Path -->
  <div class="breadcrumb-path">
    <span class="text-slate-400">Workspace</span>
    <span class="text-slate-300">›</span>
    <span class="text-slate-700 font-medium">Expense management</span>
  </div>

  <!-- Header Section -->
  <div class="reports-header">
    <span class="analytics-badge">ANALYTICS</span>
    <h1 class="reports-title">Reports</h1>
    <p class="reports-subtitle">Understand where the company budget is going.</p>
  </div>

  <!-- Total Recorded Spending Card -->
  <div class="reports-error" *ngIf="error" role="alert"><i class="pi pi-exclamation-circle"></i> {{ error }}</div>
  <div class="reports-loading" *ngIf="loading" role="status"><i class="pi pi-spin pi-spinner"></i> Loading report data…</div>
  <div class="total-card" *ngIf="!loading && !error">
    <span class="total-label">Total recorded spending</span>
    <h2 class="total-amount">{{ total | currency:'EGP':'symbol':'1.0-0' }}</h2>
  </div>

  <!-- Charts Grid Section -->
  <div class="charts-grid" *ngIf="!loading && !error">
    
    <!-- Monthly Expenses Card -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">Monthly expenses</h3>
        <p class="chart-subtitle">Spending over the last six months</p>
      </div>
      <div class="chart-wrapper">
        <p-chart *ngIf="monthlyData" type="bar" [data]="monthlyData" [options]="options" styleClass="w-full h-full"></p-chart>
      </div>
    </div>

    <!-- Category Breakdown Card -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">Category breakdown</h3>
        <p class="chart-subtitle">Spending by category</p>
      </div>
      <div class="chart-wrapper">
        <p-chart *ngIf="categoryData" type="doughnut" [data]="categoryData" [options]="options" styleClass="w-full h-full"></p-chart>
      </div>
    </div>

  </div>

</div>
