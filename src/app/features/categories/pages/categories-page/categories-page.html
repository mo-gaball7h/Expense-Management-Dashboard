<section class="page-heading"><div><p class="eyebrow">CONFIGURATION</p><h1>Categories</h1><p class="muted">Expense categories used across the application.</p></div></section>
<div class="category-grid"><article class="category-card" *ngFor="let category of categories"><span class="category-icon"><i class="pi pi-tag"></i></span><div><strong>{{ category }}</strong><small>{{ categoryStats[category]?.count ?? 0 }} transaction{{ (categoryStats[category]?.count ?? 0) === 1 ? '' : 's' }} <span>·</span> {{ (categoryStats[category]?.total ?? 0) | currency:'EGP':'symbol':'1.0-0' }}</small></div><span class="status">Active</span></article></div>
