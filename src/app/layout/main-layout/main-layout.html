<p-confirmdialog styleClass="logout-confirm-dialog" />
<div class="app-shell" (click)="closeUserMenu()">
  <div class="mobile-overlay" [class.visible]="menuOpen" (click)="closeMenu()"></div>
  
  <!-- القائمة الجانبية (Sidebar) بعد الحذف النظيف -->
  <aside class="sidebar" [class.open]="menuOpen">
    <a routerLink="/dashboard" class="brand" (click)="closeMenu()">
      <span class="brand-mark"><i class="pi pi-wallet"></i></span>
      <span><strong>Spendwise</strong><small>EXPENSE MANAGER</small></span>
    </a>
    
    <p class="nav-label">WORKSPACE</p>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()"><i class="pi pi-th-large"></i><span>Dashboard</span></a>
      <a routerLink="/expenses" routerLinkActive="active" (click)="closeMenu()"><i class="pi pi-receipt"></i><span>Expenses</span></a>
      <a routerLink="/categories" routerLinkActive="active" (click)="closeMenu()"><i class="pi pi-tags"></i><span>Categories</span></a>
      <a routerLink="/reports" routerLinkActive="active" (click)="closeMenu()"><i class="pi pi-chart-bar"></i><span>Reports</span></a>
    </nav>
    
    <p class="nav-label secondary-label">PREFERENCES</p>
    <nav>
      <a routerLink="/settings" routerLinkActive="active" (click)="closeMenu()"><i class="pi pi-cog"></i><span>Settings</span></a>
    </nav>
  </aside>

  <!-- المنطقة الرئيسية والهيدر العلوي -->
  <main class="main-area">
    <header class="topbar">
      <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen"><i class="pi pi-bars"></i></button>
      <div class="breadcrumb">Workspace <i class="pi pi-angle-right"></i> <strong>Expense management</strong></div>
      
      <div class="topbar-right">
        <!-- زرار التبديل بين الدارك واللايت مود -->
        <button class="theme-toggle-btn" type="button" (click)="toggleDarkMode()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'" [attr.aria-pressed]="isDarkMode" [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          <i class="pi" [ngClass]="isDarkMode ? 'pi-sun' : 'pi-moon'"></i>
          <span>{{ isDarkMode ? 'Light mode' : 'Dark mode' }}</span>
        </button>

        <!-- قائمة الحساب وتسجيل الخروج -->
        <div class="user-menu-container">
          <div class="user-pill" (click)="toggleUserMenu($event)">
            <span class="status-dot"></span>
            <span class="workspace-text">Local workspace</span>
            <span class="top-avatar">FM</span>
            <i class="pi pi-angle-down"></i>
          </div>

          <!-- القائمة المنسدلة للبروفाइल وتسجيل الخروج -->
          <div class="user-dropdown" *ngIf="userMenuOpen" (click)="$event.stopPropagation()">
            <div class="dropdown-header">
              <strong>Finance Manager</strong>
              <small>admin@spendwise.com</small>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-item" type="button" (click)="logout()">
              <i class="pi pi-sign-out"></i>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <router-outlet />
    </div>

    <footer>Spendwise <span>•</span> Expense Management <span class="footer-right">Frontend demo · Data stored locally</span></footer>
  </main>
</div>
